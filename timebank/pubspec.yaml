name: timebank
description: "TimeBank - Peer Tutoring Credit Exchange. Front end for the BACSE202 Oracle database project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. Bloc keeps the UI dumb: a widget dispatches an
  # event and rebuilds on a state, and never calls the network itself.
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Functional error handling. Repositories return Either<Failure, T>
  # instead of throwing, so a Bloc cannot read the success value without
  # having dealt with the failure case -- the compiler enforces it.
  fpdart: ^1.1.0

  # HTTP client for talking to the Spring Boot API. Flutter cannot use
  # JDBC directly: JDBC is a Java API and no Oracle driver exists for
  # Dart, so the architecture is
  #     Flutter --HTTP/JSON--> Spring Boot --JDBC--> Oracle
  dio: ^5.7.0

  # Service locator for dependency injection.
  get_it: ^7.7.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
