# Oracle connection settings.
#
# The thin driver needs no Oracle client installed; this URL is all it uses.
#   //host:port/service_name
# FREEPDB1 is the default pluggable database in Oracle AI Database Free.
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.user=timebank
db.password=timebank

# If you are running Oracle in Docker, the URL above still works because
# the container publishes 1521 on localhost:
#   docker run -d -p 1521:1521 -e ORACLE_PWD=YourPwd \
#     container-registry.oracle.com/database/free:latest
