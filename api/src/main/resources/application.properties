# Port 8081, not 8080: Oracle XE 11g's own APEX console already
# occupies 8080 on this machine.
#
# The API listens here. 0.0.0.0 matters: a phone or emulator on the same
# network cannot reach a server bound only to localhost.
server.address=0.0.0.0
server.port=8081

spring.application.name=timebank-api
spring.jackson.serialization.indent-output=true

# Oracle credentials live in db.properties, read by com.timebank.db.Database,
# because the console app and this API share that one pool implementation.

# ---------------------------------------------------------------------
#  The single administrator.
#
#  Credentials live here rather than in the schema on purpose. Storing
#  passwords properly means salting, hashing and rotation, which teaches
#  nothing about data modelling and is worse than useless done casually.
#  The ADMIN table records WHO the moderators are -- their name and
#  designation, and which of them ruled on a dispute. How they prove who
#  they are is a deployment concern, and this is where it lives.
# ---------------------------------------------------------------------
admin.username=namit
admin.password=timebank@2026
admin.displayName=Namit Gupta
