# Oracle connection settings.
#
# This project runs against Oracle Database XE 11g (11.2), which has no
# pluggable databases -- that came in 12c. So the service name is XE,
# not FREEPDB1.
#
#   //host:port/service_name
db.url=jdbc:oracle:thin:@//localhost:1521/XE
db.user=timebank
db.password=timebank

# If the thin URL above refuses to connect, XE also accepts the older
# SID form:
#   db.url=jdbc:oracle:thin:@localhost:1521:XE
